name: cifi_navigateur
description: Application mobile CiFi Tech - coque native enrichie autour d'un site web.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # --- affichage du site
  flutter_inappwebview: ^6.0.0

  # --- reseau et stockage
  connectivity_plus: ^6.0.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  http: ^1.2.0

  # --- notifications push et locales
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0

  # --- materiel
  geolocator: ^12.0.0
  permission_handler: ^11.3.0
  image_picker: ^1.0.0
  file_picker: ^8.0.0
  mobile_scanner: ^5.0.0
  vibration: ^2.0.0
  share_plus: ^10.0.0
  url_launcher: ^6.2.0
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

  # --- widget ecran d'accueil (Android App Widget + iOS WidgetKit)
  home_widget: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/configuration/
    - assets/pages/
    - assets/marque/

# ------------------------------------------------------------------
# Icone de l'application : ne PAS editer a la main.
# Le script scripts/appliquer_configuration.ps1 reecrit ce bloc
# depuis configuration/cifi_parametres.json
# ------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/marque/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/marque/logo.png"

# ------------------------------------------------------------------
# Splash screen natif : ne PAS editer a la main (meme script).
# ------------------------------------------------------------------
flutter_native_splash:
  color: "#0B5FFF"
  image: "assets/marque/logo_splash.png"
  color_dark: "#0E1116"
  image_dark: "assets/marque/logo_splash.png"
  android_12:
    color: "#0B5FFF"
    image: "assets/marque/logo_splash.png"
    color_dark: "#0E1116"
  android: true
  ios: true
  fullscreen: true
