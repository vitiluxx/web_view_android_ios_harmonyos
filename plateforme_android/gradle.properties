# ---------------------------------------------------------------------------
# Reglages Gradle du projet Android CiFi.
#
# Ce fichier remplace celui genere par "flutter create". Il est recopie par
# scripts/initialiser_projet.ps1 vers :
#     cifi_application/android/gradle.properties
#
# Sans ce remplacement, le gabarit Flutter demande -Xmx8G : une valeur
# pensee pour des machines de developpement bien dotees, qui fait manquer
# de memoire un poste ordinaire pendant la compilation.
# ---------------------------------------------------------------------------

# Tas de la machine virtuelle Java. 3 Go suffisent largement pour ce projet.
# Montez cette valeur seulement si Gradle signale un OutOfMemoryError.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Un seul module compile a la fois : la compilation est un peu plus lente,
# mais les pointes de memoire sont bien plus basses. Passez a true si votre
# machine a 32 Go ou plus.
org.gradle.parallel=false

# Le demon garde Gradle en memoire entre deux compilations : les suivantes
# demarrent en quelques secondes au lieu d'une minute.
org.gradle.daemon=true

# Ne recompile que ce qui a change.
org.gradle.caching=true

# --- obligatoires pour Flutter et AGP, ne pas retirer
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
